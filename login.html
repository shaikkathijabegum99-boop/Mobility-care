
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MobilityCare | Login</title>
<link rel="icon" href="Images/favicon-32x32.png" type="image/png" sizes="32x32">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap"
        rel="stylesheet">

    
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
    <style>


:root {
    --primary: #F5F3EF;
    --primary-deep: #FFFFFF;
    --secondary: #FF7A29;
    --secondary-deep: #FF9752;
    --secondary-text: #1A1006;

    --bg: #0E0E11;
    --surface: #18181C;
    --surface-alt: #212126;

    --text: #F5F3EF;
    --text-muted: #A9A7A6;
    --text-faint: #78767A;

    --border: rgba(245, 243, 239, 0.50);
    --tint: rgba(255, 122, 41, 0.06);

    --display: 'Space Grotesk', sans-serif;
    --body-font: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 26px;

    --shadow-card: 0 10px 30px rgba(255, 122, 41, 0.18);
}

body.light {
    --primary: #14141A;
    --primary-deep: #000000;
    --secondary: #FF7A29;
    --secondary-deep: #E8600D;
    --secondary-text: #FFFFFF;

    --bg: #F3F1EC;
    --surface: #FFFFFF;
    --surface-alt: #EAE6DC;

    --text: #14141A;
    --text-muted: #6B6863;
    --text-faint: #948F87;

    --border: rgba(20, 20, 26, 0.10);
    --tint: rgba(255, 122, 41, 0.09);

    --shadow-card: 0 8px 24px rgba(255, 122, 41, 0.15);
}



* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: var(--body-font);
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;

    transition:
        background 0.3s ease,
        color 0.3s ease;
}

button,
input {
    font: inherit;
}

button {
    border: none;
}

a {
    color: inherit;
    text-decoration: none;
}



.login-page {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 16px;

    background:
        radial-gradient(
            circle at top right,
            rgba(255, 122, 41, 0.13),
            transparent 32%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(255, 122, 41, 0.08),
            transparent 30%
        ),
        var(--bg);

    transition: background 0.3s ease;
}



.login-wrapper {
    width: 100%;
    max-width: 470px;
}



.login-card {
    width: 100%;

    max-height: calc(100dvh - 32px);

    padding: 22px 28px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius-lg);

    box-shadow: var(--shadow-card);

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: thin;

    transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}



.login-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 7px;
    margin-bottom: 10px;
}

.control-btn,
.rtl-btn {
    width: 34px;
    height: 34px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border);
    border-radius: 50%;

    background: var(--bg);
    color: var(--text);

    cursor: pointer;

    transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
}

.rtl-btn {
    font-family: var(--mono);
    font-size: 0.55rem;
    font-weight: 700;
}

.control-btn i {
    font-size: 0.72rem;
}

.control-btn:hover,
.rtl-btn:hover {
    background: var(--secondary);
    color: var(--secondary-text);
    border-color: var(--secondary);
    transform: translateY(-1px);
}


.login-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    width: fit-content;
    margin: 0 auto 12px;
}

.login-brand-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    background: var(--secondary);
    color: var(--secondary-text);

    border-radius: 10px;

    font-size: 0.9rem;

    transition: transform 0.25s ease;
}

.login-brand:hover .login-brand-icon {
    transform: translateY(-2px);
}

.login-brand-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.login-brand-name {
    font-family: var(--display);
    font-size: 1.08rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--secondary);
}

.login-brand-subtitle {
    font-family: var(--mono);
    font-size: 0.49rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #FFFFFF;
}

body.light .login-brand-subtitle {
    color: #000000;
}



.login-header {
    max-width: 400px;
    margin: 0 auto 15px;
    text-align: center;
}

.login-eyebrow {
    margin-bottom: 4px;

    font-family: var(--mono);
    font-size: 0.56rem;
    font-weight: 700;
    letter-spacing: 0.1em;

    text-transform: uppercase;
    color: var(--secondary);
}

.login-header h1 {
    margin-bottom: 5px;

    font-family: var(--display);
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.03em;

    color: var(--text);
}

.login-header h1 span {
    color: var(--secondary);
}

.login-header p:last-child {
    max-width: 360px;
    margin: 0 auto;

    color: var(--text-muted);

    font-size: 0.7rem;
    line-height: 1.45;
}



.login-form {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.form-group label {
    font-size: 0.67rem;
    font-weight: 600;
    color: var(--text);
}

.form-group label span {
    color: var(--secondary);
}



.input-wrapper {
    position: relative;
    width: 100%;
}

.input-wrapper > i {
    position: absolute;

    top: 50%;
    left: 11px;

    transform: translateY(-50%);

    color: var(--text-faint);
    font-size: 0.68rem;

    pointer-events: none;
}

.input-wrapper input {
    width: 100%;
    height: 39px;

    padding: 7px 36px 7px 32px;

    border: 1px solid var(--border);
    border-radius: 8px;

    outline: none;

    background: var(--bg);
    color: var(--text);

    font-size: 0.71rem;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

.input-wrapper input::placeholder {
    color: var(--text-faint);
}

.input-wrapper input:focus {
    border-color: var(--secondary);

    box-shadow:
        0 0 0 3px rgba(255, 122, 41, 0.10);
}



.password-toggle {
    position: absolute;

    top: 50%;
    right: 7px;

    transform: translateY(-50%);

    width: 25px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    color: var(--text-faint);

    cursor: pointer;

    border-radius: 50%;

    transition:
        color 0.2s ease,
        background 0.2s ease;
}

.password-toggle:hover {
    color: var(--secondary);
    background: var(--tint);
}

.password-toggle i {
    font-size: 0.65rem;
}


.login-options {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-top: 1px;
}

.remember-me {
    display: inline-flex;
    align-items: center;

    gap: 6px;

    color: var(--text-muted);
    font-size: 0.61rem;

    cursor: pointer;
}

.remember-me input {
    width: 13px;
    height: 13px;

    accent-color: var(--secondary);

    cursor: pointer;
}

.forgot-password {
    color: var(--secondary);

    font-size: 0.61rem;
    font-weight: 600;

    transition: color 0.2s ease;
}

.forgot-password:hover {
    color: var(--secondary-deep);
    text-decoration: underline;
}



.login-submit {
    width: 100%;
    min-height: 40px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 1px;
    padding: 8px 18px;

    border-radius: 999px;

    background: var(--secondary);
    color: var(--secondary-text);

    font-family: var(--display);
    font-size: 0.75rem;
    font-weight: 700;

    cursor: pointer;

    transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.login-submit:hover {
    background: var(--secondary-deep);

    transform: translateY(-1px);

    box-shadow:
        0 8px 20px rgba(255, 122, 41, 0.20);
}

.login-submit:active {
    transform: translateY(0);
}

.login-submit i {
    font-size: 0.65rem;
}



.login-divider {
    display: flex;
    align-items: center;

    gap: 10px;

    margin: 1px 0;
}

.login-divider::before,
.login-divider::after {
    content: "";

    flex: 1;

    height: 1px;

    background: var(--border);
}

.login-divider span {
    color: var(--text-faint);

    font-family: var(--mono);
    font-size: 0.5rem;

    white-space: nowrap;
}



.social-login {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 8px;
}

.social-btn {
    min-height: 36px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 7px 12px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--bg);
    color: var(--text);

    font-size: 0.65rem;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
}

.social-btn i {
    font-size: 0.75rem;
}

.social-btn:hover {
    background: var(--surface-alt);
    border-color: var(--secondary);

    transform: translateY(-1px);
}



.signup-note {
    margin-top: 1px;

    text-align: center;

    color: var(--text-muted);

    font-size: 0.63rem;
    line-height: 1.4;
}

.signup-note a {
    color: var(--secondary);
    font-weight: 700;
}

.signup-note a:hover {
    text-decoration: underline;
}


.security-note {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 5px;

    margin-top: 0;

    color: var(--text-faint);

    font-size: 0.52rem;
    line-height: 1.3;

    text-align: center;
}

.security-note i {
    color: var(--secondary);
    font-size: 0.55rem;
}



html[dir="rtl"] .login-header {
    direction: rtl;
}

html[dir="rtl"] .form-group {
    text-align: right;
}

html[dir="rtl"] .input-wrapper > i {
    left: auto;
    right: 11px;
}

html[dir="rtl"] .input-wrapper input {
    padding-left: 36px;
    padding-right: 32px;
}

html[dir="rtl"] .password-toggle {
    right: auto;
    left: 7px;
}

html[dir="rtl"] .login-submit i {
    transform: rotate(180deg);
}

html[dir="rtl"] .remember-me {
    flex-direction: row-reverse;
}


@media (max-width: 900px) {

    .login-page {
        padding: 12px;
    }

    .login-wrapper {
        max-width: 470px;
    }

    .login-card {
        max-height: calc(100dvh - 24px);
        padding: 20px 24px;
    }
}



@media (max-width: 700px) {

    .login-page {
        min-height: 100dvh;

        padding: 8px;

        align-items: center;
    }

    .login-wrapper {
        width: 100%;
    }

    .login-card {
        max-height: calc(100dvh - 16px);

        padding: 17px 16px;

        border-radius: 20px;
    }

    .login-controls {
        margin-bottom: 8px;
    }

    .control-btn,
    .rtl-btn {
        width: 32px;
        height: 32px;
    }

    .login-brand {
        margin-bottom: 10px;
    }

    .login-brand-icon {
        width: 35px;
        height: 35px;

        border-radius: 9px;

        font-size: 0.8rem;
    }

    .login-brand-name {
        font-size: 1rem;
    }

    .login-brand-subtitle {
        font-size: 0.44rem;
    }

    .login-header {
        margin-bottom: 11px;
    }

    .login-eyebrow {
        font-size: 0.51rem;
    }

    .login-header h1 {
        font-size: 1.48rem;
    }

    .login-header p:last-child {
        font-size: 0.65rem;
    }

    .login-form {
        gap: 8px;
    }

    .form-group {
        gap: 3px;
    }

    .form-group label {
        font-size: 0.62rem;
    }

    .input-wrapper input {
        height: 37px;
        font-size: 0.68rem;
    }

    .login-options {
        gap: 8px;
    }

    .remember-me,
    .forgot-password {
        font-size: 0.58rem;
    }

    .login-submit {
        min-height: 38px;
        font-size: 0.7rem;
    }

    .social-btn {
        min-height: 35px;
        font-size: 0.62rem;
    }

    .signup-note {
        font-size: 0.6rem;
    }

    .security-note {
        font-size: 0.5rem;
    }
}



@media (max-width: 420px) {

    .login-page {
        padding: 5px;
    }

    .login-card {
        max-height: calc(100dvh - 10px);

        padding: 13px 12px;

        border-radius: 17px;
    }

    .login-controls {
        gap: 5px;
        margin-bottom: 6px;
    }

    .control-btn,
    .rtl-btn {
        width: 29px;
        height: 29px;
    }

    .rtl-btn {
        font-size: 0.48rem;
    }

    .control-btn i {
        font-size: 0.62rem;
    }

    .login-brand {
        gap: 7px;
        margin-bottom: 8px;
    }

    .login-brand-icon {
        width: 32px;
        height: 32px;

        border-radius: 8px;

        font-size: 0.72rem;
    }

    .login-brand-name {
        font-size: 0.92rem;
    }

    .login-brand-subtitle {
        font-size: 0.4rem;
    }

    .login-header {
        margin-bottom: 8px;
    }

    .login-eyebrow {
        font-size: 0.46rem;
    }

    .login-header h1 {
        font-size: 1.3rem;
        margin-bottom: 3px;
    }

    .login-header p:last-child {
        font-size: 0.59rem;
    }

    .login-form {
        gap: 6px;
    }

    .form-group {
        gap: 2px;
    }

    .form-group label {
        font-size: 0.58rem;
    }

    .input-wrapper > i {
        left: 9px;
        font-size: 0.61rem;
    }

    .input-wrapper input {
        height: 34px;

        padding-left: 29px;
        padding-right: 30px;

        font-size: 0.64rem;

        border-radius: 7px;
    }

    .password-toggle {
        right: 5px;

        width: 23px;
        height: 23px;
    }

    .password-toggle i {
        font-size: 0.6rem;
    }

    .login-options {
        margin-top: 0;
    }

    .remember-me,
    .forgot-password {
        font-size: 0.54rem;
    }

    .login-submit {
        min-height: 35px;
        font-size: 0.66rem;
    }

    .login-divider {
        gap: 7px;
    }

    .login-divider span {
        font-size: 0.46rem;
    }

    .social-login {
        gap: 6px;
    }

    .social-btn {
        min-height: 33px;

        padding: 6px 8px;

        font-size: 0.57rem;
    }

    .social-btn i {
        font-size: 0.65rem;
    }

    .signup-note {
        font-size: 0.55rem;
    }

    .security-note {
        font-size: 0.47rem;
    }

    html[dir="rtl"] .input-wrapper > i {
        right: 9px;
    }

    html[dir="rtl"] .input-wrapper input {
        padding-left: 29px;
        padding-right: 29px;
    }

    html[dir="rtl"] .password-toggle {
        left: 5px;
    }
}


@media (max-height: 700px) and (min-width: 701px) {

    .login-page {
        padding-top: 6px;
        padding-bottom: 6px;
    }

    .login-card {
        max-height: calc(100dvh - 12px);

        padding-top: 12px;
        padding-bottom: 12px;
    }

    .login-controls {
        margin-bottom: 5px;
    }

    .login-brand {
        margin-bottom: 7px;
    }

    .login-header {
        margin-bottom: 7px;
    }

    .login-header h1 {
        font-size: 1.4rem;
    }

    .login-form {
        gap: 6px;
    }

    .input-wrapper input {
        height: 35px;
    }

    .login-submit {
        min-height: 36px;
    }

    .social-btn {
        min-height: 33px;
    }
}



@media (max-height: 620px) {

    .login-card {
        padding-top: 9px;
        padding-bottom: 9px;
    }

    .login-controls {
        margin-bottom: 3px;
    }

    .login-brand {
        margin-bottom: 5px;
    }

    .login-header {
        margin-bottom: 5px;
    }

    .login-header h1 {
        font-size: 1.25rem;
    }

    .login-header p:last-child {
        display: none;
    }

    .login-form {
        gap: 5px;
    }

    .form-group {
        gap: 2px;
    }

    .input-wrapper input {
        height: 32px;
    }

    .login-submit {
        min-height: 33px;
    }

    .social-btn {
        min-height: 30px;
    }

    .security-note {
        display: none;
    }
}

    </style>
</head>


<body>

    <main class="login-page">

        <div class="login-wrapper">

            <div class="login-card">

                
                <div class="login-controls">

                    <button
                        type="button"
                        id="rtl-toggle"
                        class="rtl-btn"
                        aria-label="Toggle RTL layout"
                        title="Toggle RTL">

                        RTL

                    </button>

                    <button
                        type="button"
                        class="control-btn"
                        id="themeToggle"
                        aria-label="Toggle dark and light mode"
                        title="Toggle theme">

                        <i class="fa-solid fa-sun"></i>

                    </button>

                </div>


                
                <a href="index.html" class="login-brand">

                    <span class="login-brand-icon">
                        <i class="fa-solid fa-wheelchair"></i>
                    </span>

                    <span class="login-brand-text">

                        <span class="login-brand-name">
                            MobilityCare
                        </span>

                        <span class="login-brand-subtitle">
                            Mobility &amp; Accessibility
                        </span>

                    </span>

                </a>


                
                <div class="login-header">

                    <p class="login-eyebrow">
                        WELCOME BACK
                    </p>

                    <h1>
                        Sign In to <span>MobilityCare</span>
                    </h1>

                    <p>
                        Sign in to manage your account, consultations,
                        orders, and mobility support.
                    </p>

                </div>


                
                <form id="loginForm" class="login-form">

                    
                    <div class="form-group">

                        <label for="email">
                            Email Address <span>*</span>
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                autocomplete="email"
                                required>

                        </div>

                    </div>


                    
                    <div class="form-group">

                        <label for="password">
                            Password <span>*</span>
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                                aria-label="Show password"
                                title="Show password">

                                <i class="fa-solid fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    
                    <div class="login-options">

                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="rememberMe"
                                name="rememberMe">

                            <span>
                                Remember Me
                            </span>

                        </label>

                        <a
                            href="forgot-password.html"
                            class="forgot-password">

                            Forgot Password?

                        </a>

                    </div>


                    
                    <button
                        type="submit"
                        class="login-submit">

                        Login

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                    
                    <div class="login-divider">

                        <span>
                            OR CONTINUE WITH
                        </span>

                    </div>


                    
                    <div class="social-login">

                        <button
                            type="button"
                            class="social-btn">

                            <i class="fa-brands fa-google"></i>

                            Google

                        </button>

                        <button
                            type="button"
                            class="social-btn">

                            <i class="fa-brands fa-apple"></i>

                            Apple

                        </button>

                    </div>


                    
                    <p class="signup-note">

                        Don't have an account?

                        <a href="signup.html">
                            Sign Up
                        </a>

                    </p>


                    
                    <p class="security-note">

                        <i class="fa-solid fa-shield-halved"></i>

                        Your account information is kept secure.

                    </p>

                </form>

            </div>

        </div>

    </main>


    <script>


        const themeToggle =
            document.getElementById("themeToggle");

        const savedTheme =
            localStorage.getItem("mobilityTheme");

        if (savedTheme === "light") {
            document.body.classList.add("light");
        }


        function updateThemeIcon() {

            if (!themeToggle) return;

            const icon =
                themeToggle.querySelector("i");

            if (!icon) return;

            if (
                document.body.classList.contains("light")
            ) {

                icon.classList.remove("fa-sun");
                icon.classList.add("fa-moon");

            } else {

                icon.classList.remove("fa-moon");
                icon.classList.add("fa-sun");

            }

        }


        updateThemeIcon();


        if (themeToggle) {

            themeToggle.addEventListener(
                "click",
                function () {

                    document.body.classList.toggle("light");

                    const currentTheme =
                        document.body.classList.contains("light")
                            ? "light"
                            : "dark";

                    localStorage.setItem(
                        "mobilityTheme",
                        currentTheme
                    );

                    updateThemeIcon();

                }
            );

        }



        const rtlToggle =
            document.getElementById("rtl-toggle");

        const savedDirection =
            localStorage.getItem("mobilityDirection")
            || "ltr";


        document.documentElement.setAttribute(
            "dir",
            savedDirection
        );


        if (rtlToggle) {

            rtlToggle.addEventListener(
                "click",
                function () {

                    const currentDirection =
                        document.documentElement
                            .getAttribute("dir")
                        || "ltr";

                    const newDirection =
                        currentDirection === "rtl"
                            ? "ltr"
                            : "rtl";

                    document.documentElement.setAttribute(
                        "dir",
                        newDirection
                    );

                    localStorage.setItem(
                        "mobilityDirection",
                        newDirection
                    );

                }
            );

        }



        const passwordInput =
            document.getElementById("password");

        const passwordToggle =
            document.getElementById("passwordToggle");


        if (passwordToggle && passwordInput) {

            passwordToggle.addEventListener(
                "click",
                function () {

                    const icon =
                        passwordToggle.querySelector("i");

                    if (
                        passwordInput.type === "password"
                    ) {

                        passwordInput.type = "text";

                        icon.classList.remove("fa-eye");
                        icon.classList.add("fa-eye-slash");

                        passwordToggle.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                        passwordToggle.setAttribute(
                            "title",
                            "Hide password"
                        );

                    } else {

                        passwordInput.type = "password";

                        icon.classList.remove("fa-eye-slash");
                        icon.classList.add("fa-eye");

                        passwordToggle.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                        passwordToggle.setAttribute(
                            "title",
                            "Show password"
                        );

                    }

                }
            );

        }



        const loginForm =
            document.getElementById("loginForm");


        if (loginForm) {

            loginForm.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();

                    if (!loginForm.checkValidity()) {

                        loginForm.reportValidity();

                        return;

                    }

                    alert(
                        "Login submitted successfully."
                    );

                }
            );

        }

    </script>

</body>

</html>
