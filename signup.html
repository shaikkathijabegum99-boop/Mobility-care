
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MobilityCare | Sign Up</title>
<link rel="icon" href="Images/favicon-32x32.png" type="image/png" sizes="32x32">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono&display=swap"
        rel="stylesheet">

    
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
    <style>

:root {
    --primary: #F5F3EF;
    --primary-deep: #FFFFFF;
    --secondary: #FF7A29;
    --secondary-deep: #FF9752;
    --secondary-text: #1A1006;

    --bg: #0E0E11;
    --surface: #18181C;
    --surface-alt: #212126;

    --text: #F5F3EF;
    --text-muted: #A9A7A6;
    --text-faint: #78767A;

    --border: rgba(245, 243, 239, 0.50);
    --tint: rgba(255, 122, 41, 0.06);

    --display: 'Space Grotesk', sans-serif;
    --body-font: 'Inter', sans-serif;
    --mono: 'Space Mono', monospace;

    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 26px;

    --shadow-card: 0 10px 30px rgba(255, 122, 41, 0.18);
}

body.light {
    --primary: #14141A;
    --primary-deep: #000000;
    --secondary: #FF7A29;
    --secondary-deep: #E8600D;
    --secondary-text: #FFFFFF;

    --bg: #F3F1EC;
    --surface: #FFFFFF;
    --surface-alt: #EAE6DC;

    --text: #14141A;
    --text-muted: #6B6863;
    --text-faint: #948F87;

    --border: rgba(20, 20, 26, 0.10);
    --tint: rgba(255, 122, 41, 0.09);

    --shadow-card: 0 8px 24px rgba(255, 122, 41, 0.15);
}


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: var(--body-font);
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;

    transition:
        background 0.3s ease,
        color 0.3s ease;
}

button,
input {
    font: inherit;
}

button {
    border: none;
}

a {
    color: inherit;
    text-decoration: none;
}



.signup-page {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 16px;

    background:
        radial-gradient(
            circle at top right,
            rgba(255, 122, 41, 0.13),
            transparent 32%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(255, 122, 41, 0.08),
            transparent 30%
        ),
        var(--bg);

    transition: background 0.3s ease;
}


.signup-wrapper {
    width: 100%;
    max-width: 500px;
}


.signup-card {
    width: 100%;

    /*
       Important:
       Card never becomes taller than the viewport.
    */
    max-height: calc(100dvh - 32px);

    padding: 22px 28px;

    background: var(--surface);

    border: 1px solid var(--border);
    border-radius: var(--radius-lg);

    box-shadow: var(--shadow-card);

    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: thin;

    transition:
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
}



.signup-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;

    gap: 7px;
    margin-bottom: 10px;
}

.control-btn,
.rtl-btn {
    width: 34px;
    height: 34px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: 1px solid var(--border);
    border-radius: 50%;

    background: var(--bg);
    color: var(--text);

    cursor: pointer;

    transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
}

.rtl-btn {
    font-family: var(--mono);
    font-size: 0.55rem;
    font-weight: 700;
}

.control-btn i {
    font-size: 0.72rem;
}

.control-btn:hover,
.rtl-btn:hover {
    background: var(--secondary);
    color: var(--secondary-text);
    border-color: var(--secondary);

    transform: translateY(-1px);
}



.signup-brand {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 9px;

    width: fit-content;

    margin: 0 auto 12px;
}

.signup-brand-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    background: var(--secondary);
    color: var(--secondary-text);

    border-radius: 10px;

    font-size: 0.9rem;

    transition: transform 0.25s ease;
}

.signup-brand:hover .signup-brand-icon {
    transform: translateY(-2px);
}

.signup-brand-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
}

.signup-brand-name {
    font-family: var(--display);
    font-size: 1.08rem;
    font-weight: 700;
    line-height: 1.1;
    color: var(--secondary);
}

.signup-brand-subtitle {
    font-family: var(--mono);
    font-size: 0.49rem;
    font-weight: 700;

    letter-spacing: 0.06em;
    text-transform: uppercase;

    color: #FFFFFF;
}

body.light .signup-brand-subtitle {
    color: #000000;
}



.signup-header {
    max-width: 430px;

    margin: 0 auto 15px;

    text-align: center;
}

.signup-eyebrow {
    margin-bottom: 4px;

    font-family: var(--mono);
    font-size: 0.56rem;
    font-weight: 700;

    letter-spacing: 0.1em;
    text-transform: uppercase;

    color: var(--secondary);
}

.signup-header h1 {
    margin-bottom: 5px;

    font-family: var(--display);

    font-size: 1.7rem;
    font-weight: 700;

    line-height: 1.08;
    letter-spacing: -0.03em;

    color: var(--text);
}

.signup-header h1 span {
    color: var(--secondary);
}

.signup-header p:last-child {
    max-width: 370px;

    margin: 0 auto;

    color: var(--text-muted);

    font-size: 0.7rem;
    line-height: 1.45;
}



.signup-form {
    display: flex;
    flex-direction: column;

    gap: 9px;
}

.form-row {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 10px;
}

.form-group {
    display: flex;
    flex-direction: column;

    gap: 4px;
}

.form-group label {
    font-size: 0.67rem;
    font-weight: 600;

    color: var(--text);
}

.form-group label span {
    color: var(--secondary);
}


.input-wrapper {
    position: relative;
    width: 100%;
}

.input-wrapper > i {
    position: absolute;

    top: 50%;
    left: 11px;

    transform: translateY(-50%);

    color: var(--text-faint);

    font-size: 0.68rem;

    pointer-events: none;
}

.input-wrapper input {
    width: 100%;
    height: 39px;

    padding: 7px 36px 7px 32px;

    border: 1px solid var(--border);
    border-radius: 8px;

    outline: none;

    background: var(--bg);
    color: var(--text);

    font-size: 0.71rem;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

.input-wrapper input::placeholder {
    color: var(--text-faint);
}

.input-wrapper input:focus {
    border-color: var(--secondary);

    box-shadow:
        0 0 0 3px rgba(255, 122, 41, 0.10);
}



.password-toggle {
    position: absolute;

    top: 50%;
    right: 7px;

    transform: translateY(-50%);

    width: 25px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    color: var(--text-faint);

    cursor: pointer;

    border-radius: 50%;

    transition:
        color 0.2s ease,
        background 0.2s ease;
}

.password-toggle:hover {
    color: var(--secondary);
    background: var(--tint);
}

.password-toggle i {
    font-size: 0.65rem;
}



.terms-row {
    display: flex;
    align-items: flex-start;

    gap: 7px;

    margin-top: 1px;

    color: var(--text-muted);

    font-size: 0.61rem;
    line-height: 1.4;
}

.terms-row input {
    width: 13px;
    height: 13px;

    flex-shrink: 0;

    margin-top: 1px;

    accent-color: var(--secondary);

    cursor: pointer;
}

.terms-row a {
    color: var(--secondary);
    font-weight: 600;
}

.terms-row a:hover {
    text-decoration: underline;
}


.signup-submit {
    width: 100%;
    min-height: 40px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 1px;
    padding: 8px 18px;

    border-radius: 999px;

    background: var(--secondary);
    color: var(--secondary-text);

    font-family: var(--display);
    font-size: 0.75rem;
    font-weight: 700;

    cursor: pointer;

    transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.signup-submit:hover {
    background: var(--secondary-deep);

    transform: translateY(-1px);

    box-shadow:
        0 8px 20px rgba(255, 122, 41, 0.20);
}

.signup-submit:active {
    transform: translateY(0);
}

.signup-submit i {
    font-size: 0.65rem;
}


.signup-divider {
    display: flex;
    align-items: center;

    gap: 10px;

    margin: 1px 0;
}

.signup-divider::before,
.signup-divider::after {
    content: "";

    flex: 1;

    height: 1px;

    background: var(--border);
}

.signup-divider span {
    color: var(--text-faint);

    font-family: var(--mono);

    font-size: 0.5rem;

    white-space: nowrap;
}


/* =========================================================
   SOCIAL SIGN UP
   ========================================================= */

.social-signup {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 8px;
}

.social-btn {
    min-height: 36px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 7px 12px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--bg);
    color: var(--text);

    font-size: 0.65rem;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.25s ease,
        border-color 0.25s ease,
        transform 0.25s ease;
}

.social-btn i {
    font-size: 0.75rem;
}

.social-btn:hover {
    background: var(--surface-alt);

    border-color: var(--secondary);

    transform: translateY(-1px);
}



.login-note {
    margin-top: 1px;

    text-align: center;

    color: var(--text-muted);

    font-size: 0.63rem;

    line-height: 1.4;
}

.login-note a {
    color: var(--secondary);
    font-weight: 700;
}

.login-note a:hover {
    text-decoration: underline;
}


.security-note {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 5px;

    margin-top: 0;

    color: var(--text-faint);

    font-size: 0.52rem;

    line-height: 1.3;

    text-align: center;
}

.security-note i {
    color: var(--secondary);
    font-size: 0.55rem;
}


html[dir="rtl"] .signup-header {
    direction: rtl;
}

html[dir="rtl"] .form-group {
    text-align: right;
}

html[dir="rtl"] .input-wrapper > i {
    left: auto;
    right: 11px;
}

html[dir="rtl"] .input-wrapper input {
    padding-left: 36px;
    padding-right: 32px;
}

html[dir="rtl"] .password-toggle {
    right: auto;
    left: 7px;
}

html[dir="rtl"] .terms-row {
    flex-direction: row-reverse;
    text-align: right;
}

html[dir="rtl"] .signup-submit i {
    transform: rotate(180deg);
}



@media (max-width: 900px) {

    .signup-page {
        padding: 12px;
    }

    .signup-wrapper {
        max-width: 500px;
    }

    .signup-card {
        max-height: calc(100dvh - 24px);
        padding: 20px 24px;
    }
}

    }

    }

    }

    .signup-header {

    .signup-header h1 {

    }

    }

    }

    }

    }

        min-height: 35px;

    }

        max-height: calc(100dvh - 10px);

    }

    .signup-controls {

    }

    .control-btn,

    }

        font-size: 0.47rem;
    }

    html[dir="rtl"] .input-wrapper > i {

    }

    html[dir="rtl"] .input-wrapper input {

    }

    }

    }

    }

    }
}

<body>

    <main class="signup-page">

        <div class="signup-wrapper">

            <div class="signup-card">

                
                <div class="signup-controls">

                    <button
                        type="button"
                        id="rtl-toggle"
                        class="rtl-btn"
                        aria-label="Toggle RTL layout"
                        title="Toggle RTL">

                        RTL

                    </button>

                    <button
                        type="button"
                        class="control-btn"
                        id="themeToggle"
                        aria-label="Toggle dark and light mode"
                        title="Toggle theme">

                        <i class="fa-solid fa-sun"></i>

                    </button>

                </div>


                
                <a href="index.html" class="signup-brand">

                    <span class="signup-brand-icon">
                        <i class="fa-solid fa-wheelchair"></i>
                    </span>

                    <span class="signup-brand-text">

                        <span class="signup-brand-name">
                            MobilityCare
                        </span>

                        <span class="signup-brand-subtitle">
                            Mobility &amp; Accessibility
                        </span>

                    </span>

                </a>


                
                <div class="signup-header">

                    <p class="signup-eyebrow">
                        CREATE YOUR ACCOUNT
                    </p>

                    <h1>
                        Join <span>MobilityCare</span>
                    </h1>

                    <p>
                        Create your account to manage your mobility
                        support, consultations, and orders.
                    </p>

                </div>


                
                <form id="signupForm" class="signup-form">

                    
                    <div class="form-row">

                        <div class="form-group">

                            <label for="fullName">
                                Full Name <span>*</span>
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-user"></i>

                                <input
                                    type="text"
                                    id="fullName"
                                    name="fullName"
                                    placeholder="Enter your full name"
                                    autocomplete="name"
                                    required>

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number <span>*</span>
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-phone"></i>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="Enter phone number"
                                    autocomplete="tel"
                                    required>

                            </div>

                        </div>

                    </div>


                    
                    <div class="form-group">

                        <label for="email">
                            Email Address <span>*</span>
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                autocomplete="email"
                                required>

                        </div>

                    </div>


                    
                    <div class="form-row">

                        <div class="form-group">

                            <label for="password">
                                Password <span>*</span>
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Create a password"
                                    autocomplete="new-password"
                                    minlength="6"
                                    required>

                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="password"
                                    aria-label="Show password"
                                    title="Show password">

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="confirmPassword">
                                Confirm Password <span>*</span>
                            </label>

                            <div class="input-wrapper">

                                <i class="fa-solid fa-lock"></i>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Confirm password"
                                    autocomplete="new-password"
                                    minlength="6"
                                    required>

                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="confirmPassword"
                                    aria-label="Show password"
                                    title="Show password">

                                    <i class="fa-solid fa-eye"></i>

                                </button>

                            </div>

                        </div>

                    </div>


                    
                    <label class="terms-row">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                            required>

                        <span>
                            I agree to the
                            <a href="terms.html">Terms &amp; Conditions</a>
                            and
                            <a href="privacy.html">Privacy Policy</a>.
                        </span>

                    </label>


                    
                    <button
                        type="submit"
                        class="signup-submit">

                        Create Account

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                    
                    <div class="signup-divider">

                        <span>
                            OR SIGN UP WITH
                        </span>

                    </div>


                    
                    <div class="social-signup">

                        <button
                            type="button"
                            class="social-btn">

                            <i class="fa-brands fa-google"></i>

                            Google

                        </button>

                        <button
                            type="button"
                            class="social-btn">

                            <i class="fa-brands fa-apple"></i>

                            Apple

                        </button>

                    </div>


                    
                    <p class="login-note">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>


                    
                    <p class="security-note">

                        <i class="fa-solid fa-shield-halved"></i>

                        Your account information is kept secure.

                    </p>

                </form>

            </div>

        </div>

    </main>


    <script>


        const themeToggle =
            document.getElementById("themeToggle");

        const savedTheme =
            localStorage.getItem("mobilityTheme");

        if (savedTheme === "light") {
            document.body.classList.add("light");
        }


        function updateThemeIcon() {

            if (!themeToggle) return;

            const icon =
                themeToggle.querySelector("i");

            if (!icon) return;

            if (
                document.body.classList.contains("light")
            ) {

                icon.classList.remove("fa-sun");
                icon.classList.add("fa-moon");

            } else {

                icon.classList.remove("fa-moon");
                icon.classList.add("fa-sun");

            }

        }


        updateThemeIcon();


        if (themeToggle) {

            themeToggle.addEventListener(
                "click",
                function () {

                    document.body.classList.toggle("light");

                    const currentTheme =
                        document.body.classList.contains("light")
                            ? "light"
                            : "dark";

                    localStorage.setItem(
                        "mobilityTheme",
                        currentTheme
                    );

                    updateThemeIcon();

                }
            );

        }



        const rtlToggle =
            document.getElementById("rtl-toggle");

        const savedDirection =
            localStorage.getItem("mobilityDirection")
            || "ltr";


        document.documentElement.setAttribute(
            "dir",
            savedDirection
        );


        if (rtlToggle) {

            rtlToggle.addEventListener(
                "click",
                function () {

                    const currentDirection =
                        document.documentElement
                            .getAttribute("dir")
                        || "ltr";

                    const newDirection =
                        currentDirection === "rtl"
                            ? "ltr"
                            : "rtl";

                    document.documentElement.setAttribute(
                        "dir",
                        newDirection
                    );

                    localStorage.setItem(
                        "mobilityDirection",
                        newDirection
                    );

                }
            );

        }



        const passwordToggles =
            document.querySelectorAll(".password-toggle");


        passwordToggles.forEach(function (toggle) {

            toggle.addEventListener(
                "click",
                function () {

                    const targetId =
                        toggle.getAttribute("data-target");

                    const input =
                        document.getElementById(targetId);

                    const icon =
                        toggle.querySelector("i");

                    if (!input || !icon) return;


                    if (input.type === "password") {

                        input.type = "text";

                        icon.classList.remove("fa-eye");
                        icon.classList.add("fa-eye-slash");

                        toggle.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                        toggle.setAttribute(
                            "title",
                            "Hide password"
                        );

                    } else {

                        input.type = "password";

                        icon.classList.remove("fa-eye-slash");
                        icon.classList.add("fa-eye");

                        toggle.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                        toggle.setAttribute(
                            "title",
                            "Show password"
                        );

                    }

                }
            );

        });



        const signupForm =
            document.getElementById("signupForm");

        const password =
            document.getElementById("password");

        const confirmPassword =
            document.getElementById("confirmPassword");


        if (signupForm) {

            signupForm.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();


                    if (!signupForm.checkValidity()) {

                        signupForm.reportValidity();

                        return;

                    }


                    if (
                        password.value !==
                        confirmPassword.value
                    ) {

                        alert(
                            "Passwords do not match. Please try again."
                        );

                        confirmPassword.focus();

                        return;

                    }


                    alert(
                        "Your MobilityCare account has been created successfully."
                    );

                    signupForm.reset();

                }
            );

        }

    </script>

</body>

</html>
